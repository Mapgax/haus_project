user_agent: "HausfinderBot/0.1 (+personal property search; contact: you@example.com)"
request_timeout_sec: 20
# No local database: state lives in Supabase (SUPABASE_DB_URL, see .env.example).
# `db_path` only matters for the legacy local runner (hausfinder.main).

filters:
  min_rooms: 5
  min_area_sqm: 100
  buy_price_limit_chf: 3000000
  rent_price_limit_chf: 5000
  target_postcodes: ["8280", "8274", "8598"]
  target_localities: ["kreuzlingen", "taegerwilen", "tägerwilen", "bottighofen"]
  preferred_neighborhoods: ["zentrum", "egelshofen"]
  discouraged_neighborhoods: ["kurzrickenbach", "bernrain"]
  allow_ambiguous_neighborhood: true
  strict_location_match: true
  location_fallback_to_raw_text: false

# Niederlande-Suche: Katwijk/Rijnsburg/Valkenburg (ZH), nur Kauf, 4+ Zimmer,
# KEIN Preislimit (User-Entscheid). Harte Gates: Wasserlage (Strassen-Whitelist
# ODER Steiger/Wasser-Keyword), keine Recreatie-/Ferienhaus-Objekte, harte
# Strassen-Blockliste. condition_plus/_minus + Bouwjaar 1960-1985 sind nur
# Score (Down-Ranking) — nie ein Filter.
filters_nl:
  min_rooms: 4
  target_localities: ["katwijk", "rijnsburg", "valkenburg"]
  out_of_scope: ["valkenburg aan de geul", "limburg", "oegstgeest"]
  waterfront_streets: ["overrijn", "rijnstraat", "uiterdijk", "oegstgeesterweg",
                       "willibrordlaan", "karel de grotelaan", "kanaalpad"]
  waterfront_keywords: ["aanlegsteiger", "eigen steiger", "botenhuis", "ligplaats",
                        "aan het water", "waterkavel", "vlonder", "steiger",
                        "aan de rijn", "aan de oude rijn"]
  recreation_exclude: ["recreatiewoning", "vakantiewoning", "recreatiebestemming",
                       "stacaravan", "chalet", "niet permanente bewoning",
                       "recreatief gebruik"]
  discouraged_streets: ["duizendschoon", "wingerd", "bankijkerweg"]
  condition_plus: ["gerenoveerd", "instapklaar", "karakteristiek", "jaren 30",
                   "jaren '30", "gemoderniseerd", "hoogwaardig afgewerkt"]
  condition_minus: ["opknapper", "kluswoning", "gedateerd", "moet gemoderniseerd",
                    "achterstallig onderhoud"]

dashboard:
  enabled: true
  open_browser: true
  output_html_path: "data/dashboard.html"
  recent_rows: 200

# Push-Benachrichtigung fuer neue Treffer via ntfy.sh — feuert nur, wenn ein
# Lauf tatsaechlich neue Listings findet. Der Topic-Name kommt aus der
# Env-Variable NTFY_TOPIC (lokal via .env, in CI als GitHub-Secret) und darf
# nicht committed werden: Wer den Topic kennt, kann mitlesen. Achtung: Der
# Fingerprint enthaelt Preis/Titel/Flaeche/Zimmer, d.h. eine Preisaenderung
# meldet ein bestehendes Inserat erneut als neu (gewollter Preis-Alert).
ntfy:
  enabled: true
  server_url: "https://ntfy.sh"
  topic_env: "NTFY_TOPIC"
  max_individual: 8

