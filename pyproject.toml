[project]
name = "hausfinder"
version = "0.1.0"
description = "Daily property search and email digest for Kreuzlingen."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "requests>=2.32.0,<3",
  "beautifulsoup4>=4.12.0,<5",
  "psycopg[binary]>=3.2.0,<4",
  "pillow>=10,<12",
  "pytesseract>=0.3.10,<0.4",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.5.0,<2",
]

[project.scripts]
hausfinder = "hausfinder.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
